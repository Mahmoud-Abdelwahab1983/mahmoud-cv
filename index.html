const L={en:{about:"About Me",exp:"Professional Experience",skills:"Skills & Strengths",edu:"Education",certs:"Maritime Certificates",tools:"Owner Tools",edit:"✏️ Edit",done:"✅ Done",add:"＋ Add",print:"🖨 Print / PDF",exp2:"📤 Export",imp:"📥 Import",reset:"↺ Reset",nt:"Your edits are saved in this browser only. Export a backup to move them to another device.",other:"عربي",c:"Contact"},
ar:{about:"عن نفسي",exp:"الخبرة المهنية",skills:"المهارات ونقاط القوة",edu:"التعليم",certs:"الشهادات البحرية",tools:"أدوات المالك",edit:"✏️ تعديل",done:"✅ تم",add:"＋ إضافة",print:"🖨 طباعة / PDF",exp2:"📤 تصدير",imp:"📥 استيراد",reset:"↺ إعادة ضبط",nt:"تُحفظ تعديلاتك في هذا المتصفح فقط. صدّر نسخة احتياطية لنقلها إلى جهاز آخر.",other:"EN",c:"التواصل"}};
let S,lang='en',edit=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=o=>typeof o==='string'?o:(o[lang]||o.en||'');
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const E=(p,tag='span',cls='')=>`<${tag} class="ed ${cls}" data-p="${p}">${esc(T(get(p)))}</${tag}>`;
const t=L=>L[lang];
function render(){
const l=L[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
document.body.classList.toggle('editing',edit);
const ini=T(S.name).split(' ').slice(0,2).map(w=>w[0]).join('');
document.getElementById('app').innerHTML=`

if(par[last]&&typeof par[last]==='object')par[last][lang]=v;else par[last]=v;save()});

const NEW={exp:()=>({r:{en:"New Role"},c:"Company",p:"Year – Year",d:"Describe your responsibilities and achievements."}),skills:()=>({i:"⭐",t:{en:"New Skill"},d:{en:"Details"}}),certs:()=>({n:"Certificate name",m:"Number · Issued · Expiry"})};

if(a=='lang'){lang=lang=='en'?'ar':'en'}
else if(a=='edit'){edit=!edit}

else if(a=='del'){if(confirm('Delete?')){S[b.dataset.l].splice(+b.dataset.i,1);save()}}
else if(a=='print'){window.print();return}
else if(a=='photo'){if(edit)document.getElementById('ph').click();return}

else if(a=='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const x=document.createElement('a');x.href=u;x.download='cv-backup.json';x.click();return}
render()});
document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(x){alert('Invalid file')}};r.readAsText(f)};
document.getElementById('ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.85);save();render()};im.src=URL.createObjectURL(f)};
